<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shoulders</title>
<meta name="theme-color" content="#FDEBC4">
<meta name="color-scheme" content="only light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Schouders">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<style>
:root{color-scheme:only light;
  --mint:#FDEBC4; --mint2:#FEF6E4; --cream:#FFFCF6; --ink:#2B241C;
  --hot:#B5503A; --pink:#D99A92; --orange:#D3763C; --sun:#E3A63E;
  --purple:#36456B; --sky:#357F75; --red:#B5503A;
  --caps:'Libre Caslon Text',Georgia,'Times New Roman',serif;
  --body:'Source Serif 4',Georgia,'Times New Roman',serif;
  --line:1.5px solid var(--ink);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:var(--body);font-size:17px;line-height:1.45;color:var(--ink);background:var(--mint);
  background-image:
    radial-gradient(120% 52% at 50% -10%, rgba(255,255,255,.55), rgba(255,255,255,0) 70%),
    repeating-conic-gradient(from 0deg at 50% 0%,
      rgba(232,124,46,.30) 0 6deg, rgba(255,255,255,0) 6deg 12deg,
      rgba(246,186,61,.40) 12deg 18deg, rgba(255,255,255,0) 18deg 24deg,
      rgba(44,96,168,.22) 24deg 30deg, rgba(255,255,255,0) 30deg 36deg);
  background-attachment:fixed}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
[hidden]{display:none!important}
#app{max-width:640px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}

/* kaders */
.card{background:var(--cream);border:var(--line);border-radius:14px;overflow:hidden}
.cap{font-family:var(--caps);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.btn{display:inline-block;font-family:var(--caps);text-transform:uppercase;letter-spacing:.06em;font-weight:700;font-size:14px;
  padding:12px 18px;border:var(--line);border-radius:999px;background:var(--cream);min-height:46px}
.btn.main{background:var(--hot);color:#fff}
.btn.sun{background:var(--sun)}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.5}
.btn.small{padding:8px 14px;min-height:38px;font-size:12px}
.link{text-decoration:underline;font-size:15px}

/* bovenbalk */
.top{padding:max(14px,env(safe-area-inset-top)) 16px 8px}
.brand{display:block;text-align:center;background:var(--cream);border:var(--line);border-radius:14px;padding:10px 12px;
  font-family:var(--caps);text-transform:uppercase;letter-spacing:.14em;font-weight:700;font-size:15px}
.brand small{display:block;font-family:var(--body);text-transform:none;letter-spacing:0;font-weight:400;font-style:italic;font-size:14px;margin-top:2px}
.content{flex:1;padding:8px 16px 110px;display:flex;flex-direction:column;gap:14px}
h2{font-family:var(--caps);text-transform:uppercase;letter-spacing:.08em;font-size:15px;margin:6px 2px 0}

.nav button.dot{position:relative}
.nav button.dot:after{content:"";position:absolute;top:7px;right:calc(50% - 26px);width:8px;height:8px;border-radius:50%;background:#D62828;border:1px solid var(--ink)}
.nw{display:inline-block;width:9px;height:9px;border-radius:50%;background:#D62828;border:1px solid var(--ink);margin-left:7px;vertical-align:middle}
/* quiz */
.qnum{font-family:var(--caps);text-transform:uppercase;letter-spacing:.06em;font-size:12px;opacity:.7;margin:10px 0 2px}
.qv{font-size:17px;margin:0 0 10px}
.opts{display:grid;gap:8px}
.opt{text-align:left;width:100%}
.opt.goed{background:#DFF3E6;border-color:#1F7A4D}
.opt.fout{background:#FBE3E3;border-color:#A8322C}
.opt.uit{opacity:.5}
.opt i{float:right;font-style:normal;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;font-family:var(--caps);opacity:.75;margin-left:8px}
.fb{margin:10px 0;font-size:15px}
.fb.ok{color:#1F7A4D}
.qr{border-top:1px solid rgba(20,20,20,.15);padding:9px 0;font-size:14px}
.qr b{display:block}
.qr i{display:block;opacity:.75;font-size:13px;margin:2px 0}
.qr span{display:block;margin-top:3px;opacity:.8}
.qr.ok span{color:#1F7A4D}
.sb{list-style:none;margin:8px 0 0;padding:0;counter-reset:p}
.sb li{counter-increment:p;display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid rgba(20,20,20,.12)}
.sb li:before{content:counter(p);font-family:var(--caps);font-weight:700;width:22px;opacity:.6}
.sb li span{flex:1}
.sb li.me{font-weight:700}
.win{margin-top:10px;padding:9px 11px;background:var(--sun);border:var(--line);border-radius:12px;font-size:14px}
/* navigatie */
.nav{position:fixed;left:0;right:0;bottom:0;padding:8px 16px max(10px,env(safe-area-inset-bottom));display:flex;justify-content:center;pointer-events:none}
.nav>div{pointer-events:auto;display:flex;width:100%;max-width:608px;background:var(--cream);border:var(--line);border-radius:999px;overflow:hidden}
.nav button{flex:1;padding:12px 4px;font-family:var(--caps);text-transform:uppercase;letter-spacing:.06em;font-weight:700;font-size:13px}
.nav button+button{border-left:var(--line)}
.nav button.on{background:var(--sun)}

/* dagquote */
.qcard{background:var(--cream);border:var(--line);border-radius:14px;overflow:hidden}
.qcard .qh{border-bottom:var(--line);padding:8px 12px;text-align:center;font-family:var(--caps);text-transform:uppercase;letter-spacing:.1em;font-size:12px;font-weight:700;background:var(--sun)}
.qcard .qb{padding:16px 18px}
.qcard blockquote{font-size:20px;line-height:1.3;font-style:italic}
.qcard cite{display:block;margin-top:10px;font-style:normal;font-size:14px}
.qcard cite b{font-family:var(--caps);text-transform:uppercase;letter-spacing:.06em}

/* figuren */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fc{background:var(--cream);border:var(--line);border-radius:14px;overflow:hidden;text-align:left;display:flex;flex-direction:column}
.fc .nm{border-bottom:var(--line);padding:8px 6px;text-align:center;font-family:var(--caps);text-transform:uppercase;letter-spacing:.05em;font-weight:700;font-size:12.5px;line-height:1.2}
.art{position:relative;aspect-ratio:1/.85;overflow:hidden;border-bottom:var(--line);
  background:repeating-conic-gradient(from 0deg at 50% 78%, var(--c) 0 9deg, color-mix(in srgb,var(--c) 50%, #fff) 9deg 18deg)}
.art .sh{position:absolute;left:14%;right:14%;bottom:-34%;height:70%;border-radius:50%;background:var(--a,var(--sun));border:var(--line)}
.art .hd{position:absolute;left:50%;top:50%;width:46%;aspect-ratio:1;transform:translate(-50%,-62%);border-radius:50%;background:var(--cream);border:var(--line);display:grid;place-items:center;
  font-family:var(--caps);font-weight:700;font-size:clamp(22px,8vw,40px)}
.art .st{position:absolute;width:9px;height:9px;background:var(--cream);border:1.5px solid var(--ink);border-radius:50%}
.fc{background:var(--cream);box-shadow:3px 3px 0 var(--ink);border-radius:16px;padding:6px}
.fc .nm{border:var(--line);border-radius:10px;background:#fff;margin-bottom:6px}
.fc .art{border:var(--line);border-radius:10px;aspect-ratio:1/1.05}
.fc .art:after{content:"";position:absolute;inset:5px;border:1px solid var(--ink);border-radius:7px;opacity:.5;pointer-events:none}
.art.dr svg{width:100%;height:100%;display:block}
.art .sy{position:absolute;left:50%;top:50%;width:62%;aspect-ratio:1;transform:translate(-50%,-50%);background:var(--cream);border:var(--line);display:grid;place-items:center;box-shadow:3px 3px 0 var(--ink)}
.art .sy svg{width:78%;height:78%}
.art.ph{overflow:hidden}
.art.ph img{width:100%;height:100%;object-fit:cover;display:block}
.fc .tg{padding:8px 4px 6px;font-size:13.5px;line-height:1.3;flex:1}
.fc .ln{display:flex;gap:6px;align-items:flex-start;margin-top:6px}
.fc .ln svg{flex:none;margin-top:1px;width:16px;height:16px}
.fc .yr{display:block;font-style:normal;font-size:12.5px;opacity:.75;margin-bottom:3px}
.sm{width:40px;height:40px;border-radius:50%;border:var(--line);display:grid;place-items:center;font-family:var(--caps);font-weight:700;font-size:15px;background:var(--cream);flex:none;
  box-shadow:inset 0 -14px 0 0 var(--c)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:var(--line);border-radius:999px;padding:5px 11px;font-size:13.5px;background:var(--cream)}
.chip.pick{padding:8px 13px;font-size:15px}
.chip.on{background:var(--sun);font-weight:600;display:inline-flex;align-items:center;gap:6px}
.chip .rm{font:inherit;font-size:17px;line-height:1;padding:0 2px;opacity:.6;background:none;border:0}
.chip .rm:hover{opacity:1}

/* chatlijst */
.room{display:flex;gap:12px;align-items:center;padding:12px;text-align:left;width:100%}
.room .av{display:flex}
.room .av .sm{width:34px;height:34px;font-size:12px;margin-left:-10px;box-shadow:inset 0 -12px 0 0 var(--c)}
.room .av .sm:first-child{margin-left:0}
.room .tx{flex:1;min-width:0}
.room b{display:block;font-family:var(--caps);font-size:15px;letter-spacing:.02em}
.room small{display:block;font-size:14px;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{padding:22px 18px;text-align:center;font-style:italic}

/* sheet */
.veil{position:fixed;inset:0;background:rgba(20,20,20,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet{width:100%;max-width:640px;max-height:90dvh;overflow:auto;background:var(--cream);border:var(--line);border-bottom:0;border-radius:18px 18px 0 0;padding:18px 18px max(22px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px}
.sheet h3{font-family:var(--caps);text-transform:uppercase;letter-spacing:.08em;font-size:16px;text-align:center}
.sheet .x{align-self:flex-end;font-size:14px;text-decoration:underline}
.code{font-family:var(--caps);font-weight:700;font-size:34px;letter-spacing:.2em;text-align:center;background:var(--mint2);border:var(--line);border-radius:12px;padding:10px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:15px}
label.f span{font-family:var(--caps);text-transform:uppercase;letter-spacing:.06em;font-size:12px;font-weight:700}
input[type=text],input[type=email],input[type=password],textarea{width:100%;border:var(--line);border-radius:12px;padding:12px 14px;background:#fff;font-size:17px}
input:focus,textarea:focus{outline:3px solid var(--sky)}
.hint{font-size:14px;opacity:.8}
.err{background:#FFE3E3;border:var(--line);border-radius:12px;padding:10px 12px;font-size:15px}
.ok{background:var(--mint2);border:var(--line);border-radius:12px;padding:10px 12px;font-size:15px}

/* inloggen */
.auth{padding:6px 16px 40px;display:flex;flex-direction:column;gap:14px}
.auth .card{padding:18px;display:flex;flex-direction:column;gap:14px}
.tabs{display:flex;border:var(--line);border-radius:999px;overflow:hidden}
.tabs button{flex:1;padding:10px;font-family:var(--caps);text-transform:uppercase;letter-spacing:.06em;font-weight:700;font-size:13px}
.tabs button+button{border-left:var(--line)}
.tabs .on{background:var(--sun)}

/* chat */
.chat{display:flex;flex-direction:column;height:100dvh}
.chat-top{display:flex;align-items:center;gap:10px;padding:max(10px,env(safe-area-inset-top)) 12px 10px;background:var(--cream);border-bottom:var(--line)}
.chat-top .ct{flex:1;min-width:0}
.chat-top b{display:block;font-family:var(--caps);text-transform:uppercase;letter-spacing:.05em;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-top small{display:block;font-size:13px;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{border:var(--line);border-radius:999px;min-width:42px;height:42px;padding:0 12px;font-family:var(--caps);text-transform:uppercase;font-weight:700;font-size:12px;letter-spacing:.05em;background:var(--cream)}
.list{flex:1;overflow:auto;padding:14px 14px 8px;display:flex;flex-direction:column;gap:12px}
.note{align-self:center;max-width:92%;text-align:center;font-size:14px;font-style:italic;background:var(--cream);border:var(--line);border-radius:12px;padding:9px 12px}
.m{display:flex;gap:8px;max-width:92%}
.m.me{align-self:flex-end;flex-direction:row-reverse}
.bub{border:var(--line);border-radius:16px;padding:9px 13px;background:#fff;min-width:0;overflow-wrap:anywhere}
.m.me .bub{background:var(--sun)}
.who{display:block;font-family:var(--caps);text-transform:uppercase;letter-spacing:.06em;font-weight:700;font-size:11.5px;margin-bottom:2px}
.who i{font-style:normal;font-family:var(--body);text-transform:none;letter-spacing:0;font-weight:400;opacity:.7;margin-left:6px}
.m.fig .bub{background:var(--cream)}
.m.fig .sm{margin-top:2px}
.q{margin-top:9px;padding:8px 10px;border:var(--line);border-radius:10px;background:var(--mint2);font-style:italic;font-size:16px}
.q cite{display:block;font-style:normal;font-size:12.5px;margin-top:4px;opacity:.8}
.lw{display:block;margin-top:7px}
.lb{display:inline-flex;align-items:center;gap:5px;background:transparent;border:1.5px solid var(--ink);border-radius:999px;padding:3px 9px;font:inherit;font-size:12.5px;cursor:pointer;opacity:.55}
.lb.on{opacity:1;background:#fff}
.lb svg{opacity:.35}
.lb.on svg{opacity:1}
.m.me .lb{border-color:#fff;color:#fff}
.m.me .lb.on{background:rgba(255,255,255,.18)}
.lkm{align-items:center;gap:7px;font-size:13.5px;opacity:.85}
.lkm span{display:flex;align-items:center;gap:5px}
.bub.kort{font-size:14.5px;opacity:.92}
.adm{background:#fff}
.fl{display:flex;align-items:center;gap:8px;margin:7px 0}
.fl input{flex:1;min-width:0;padding:8px 10px;border:var(--line);border-radius:10px;font:inherit;font-size:14px;background:var(--cream)}
.sug{display:block;width:100%;margin-top:9px;font-size:14px;background:var(--sun)}
.tk{display:flex;gap:7px;align-items:center;margin-top:9px;padding-top:8px;border-top:1px dashed var(--ink);font-size:15px}
.tk svg{flex:none}
.typing{padding:2px 16px 6px;font-style:italic;font-size:14px}
.composer{padding:8px 12px max(10px,env(safe-area-inset-bottom));background:var(--cream);border-top:var(--line);display:flex;flex-direction:column;gap:8px}
.sw{align-self:flex-start;display:flex;align-items:center;gap:8px;font-size:14px;padding:4px 2px}
.sw i{width:38px;height:22px;border:var(--line);border-radius:999px;position:relative;background:#fff;transition:background .15s}
.sw i:after{content:"";position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:var(--ink);transition:transform .15s}
.sw[aria-pressed=true] i{background:var(--hot)}
.sw[aria-pressed=true] i:after{transform:translateX(16px);background:#fff;border:1px solid var(--ink)}
.inp{display:flex;gap:8px;align-items:flex-end}
.inp textarea{resize:none;max-height:140px;border-radius:18px}
.send{flex:none;width:46px;height:46px;border-radius:50%;border:var(--line);background:var(--hot);color:#fff;font-size:22px;font-weight:700}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);max-width:88%;background:var(--ink);color:#fff;padding:11px 16px;border-radius:12px;font-size:15px;z-index:99;text-align:center}
ol.steps{padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:16px}
.pad{padding:16px 18px;display:flex;flex-direction:column;gap:10px}
</style>
</head>
<body>
<div id="app"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>

  quotes:[{"text": "Ain't I a woman?", "source": "Toespraak in Akron, 1851 (overgeleverd door Frances Gage, wording betwist)"}, {"text": "Truth burns up error.", "source": "Narrative of Sojourner Truth (Olive Gilbert)"}, {"text": "Then I will speak upon the ashes.", "source": "1862, over een dreiging dat de zaal zou worden verbrand (Narrative of Sojourner Truth)"}, {"text": "I am glad to see that men are getting their rights, but I want women to get theirs, and while the water is stirring I will step into the pool.", "source": "Toespraak, 1867"}, {"text": "Religion without humanity is poor human stuff.", "source": "Toespraak, 1851 (aangehaald door Carleton Mabee)"}]},
 {slug:'jacobs',name:'Aletta Jacobs',years:'1854–1929',country:'Nederland',color:'#1FA59A',

 {slug:'phule',name:'Savitribai Phule',years:'1831–1897',country:'India',color:'#FFD34D',
  tagline:'Opende de eerste meisjesschool en vocht tegen kaste en uitsluiting.',themes:['onderwijs','kaste','solidariteit'],

 {slug:'beauvoir',name:'Simone de Beauvoir',years:'1908–1986',country:'Frankrijk',color:'#E8409A',

  bio:"Filosoof en schrijver. In Le Deuxième Sexe (1949) liet ze zien hoe wat we 'vrouwelijk' noemen is gemaakt door samenleving en opvoeding.",
  quotes:[{"text": "One is not born, but rather becomes, a woman.", "source": "Le Deuxième Sexe, 1949 (Engelse vertaling)"}, {"text": "Her wings are cut and then she is blamed for not knowing how to fly.", "source": "Le Deuxième Sexe, 1949 (Engelse vertaling)"}, {"text": "The body is not a thing, it is a situation.", "source": "Le Deuxième Sexe, 1949 (Engelse vertaling)"}, {"text": "Authentic love must be founded on reciprocal recognition of two freedoms.", "source": "Le Deuxième Sexe, 1949 (Engelse vertaling)"}]},
 {slug:'lorde',name:'Audre Lorde',years:'1934–1992',country:'Verenigde Staten',color:'#2F6FDE',
  tagline:'Dichter, Zwart, lesbisch, moeder, strijder. Verschil is kracht.',themes:['intersectionaliteit','woede','zelfzorg'],
  bio:'Dichter en essayist, dochter van Caribische migranten. Schreef over racisme, seksisme, homofobie en klasse, en over ziek zijn. Zag verschil als kracht.',
  quotes:[{"text": "The master's tools will never dismantle the master's house.", "source": "Toespraak, 1979"}, {"text": "Your silence will not protect you.", "source": "The Transformation of Silence into Language and Action, in Sister Outsider"}, {"text": "Caring for myself is not self-indulgence, it is self-preservation.", "source": "A Burst of Light, 1988"}, {"text": "Change is the immediate responsibility of each of us.", "source": "Learning from the 60s, in Sister Outsider"}, {"text": "I am not free while any woman is unfree", "source": "Learning from the 60s, in Sister Outsider"}]},
 {slug:'hooks',name:'bell hooks',years:'1952–2021',country:'Verenigde Staten',color:'#F2933A',
  tagline:'Feminisme is voor iedereen.',themes:['liefde','klasse','ras','leren'],
  bio:'Schreef over ras, klasse en gender, over liefde en over onderwijs. Zij schreef haar naam bewust met kleine letters: het gaat om haar ideeën, niet om haar.',
  quotes:[{"text": "Feminism is for everybody.", "source": "Feminism Is for Everybody, 2000"}, {"text": "Feminism is a movement to end sexism, sexist exploitation, and oppression.", "source": "Feminism Is for Everybody, 2000"}, {"text": "We do not have to love. We choose to love.", "source": "All About Love, 2000"}, {"text": "The moment we choose to love we begin to move against domination, against oppression.", "source": "Outlaw Culture, 1994"}]},
 {slug:'mernissi',name:'Fatema Mernissi',years:'1940–2015',country:'Marokko',color:'#0F8B6D',
  tagline:'Vrijheid en islam hoeven elkaar niet uit te sluiten.',themes:['islam','macht','verhalen'],
  bio:'Marokkaanse socioloog en schrijver. Onderzocht hoe religie en traditie zijn gebruikt om vrouwen klein te houden, en liet zien hoe vrouwen eigen macht en verhalen hadden.',quotes:[{"text": "Angry women are hostages of their anger.", "source": "Dreams of Trespass, 1994"}, {"text": "The worst of prisons is a self-created one.", "source": "Dreams of Trespass, 1994"}, {"text": "Mothers should tell little girls and boys about the importance of dreams.", "source": "Dreams of Trespass, 1994"}, {"text": "If you can't get out, you are on the powerless side.", "source": "Dreams of Trespass, 1994"}]},
 {slug:'maathai',name:'Wangari Maathai',years:'1940–2011',country:'Kenia',color:'#5BAA3C',
  tagline:'Plant een boom en verander je wereld.',themes:['natuur','volhouden','moed'],
  bio:'Kreeg als eerste Afrikaanse vrouw de Nobelprijs voor de Vrede (2004). Richtte de Green Belt Movement op, waarmee vrouwen miljoenen bomen plantten en zo inkomen en zelfvertrouwen kregen.',
  quotes:[{"text": "It's the little things citizens do. That's what will make the difference.", "source": "Wangari Maathai"}, {"text": "If we can send man to the moon, why can we not plant a tree?", "source": "Wangari Maathai"}, {"text": "…to heal her wounds and in the process heal our own.", "source": "Nobellezing, 2004"}]},
 {slug:'anzaldua',name:'Gloria Anzaldúa',years:'1942–2004',country:'Verenigde Staten (Texas)',color:'#B04BC9',
  tagline:'Wonen op de grens: tussen talen, culturen en identiteiten.',themes:['identiteit','grenzen','taal'],
  bio:"Chicana-schrijver en denker uit Zuid-Texas. Schreef over leven tussen twee culturen, taal en queer-zijn. Zag het 'tussen in zitten' als een bron van inzicht.",
  quotes:[{"text": "Nothing happens in the ‘real’ world unless it first happens in the images in our heads.", "source": "Borderlands/La Frontera, 1987"}, {"text": "Awareness of our situation must come before inner changes…", "source": "Borderlands/La Frontera, 1987"}, {"text": "The sea cannot be fenced, El mar does not stop at borders.", "source": "Borderlands/La Frontera, 1987"}]},
 {slug:"angelou",name:"Maya Angelou",years:"1928–2014",country:"Verenigde Staten",color:"#D9482B",kind:"historisch",
  tagline:"Dichter, verteller, overlever. Je kunt veranderd worden zonder verkleind te worden.",themes:["veerkracht", "stem", "trots"],
  bio:"Schreef over opgroeien in het gescheiden Zuiden, over racisme, trauma en kracht. Werd dichter, activist en een van de meest gelezen stemmen van Amerika.",quotes:[{"text": "There is no greater agony than bearing an untold story inside you.", "source": "I Know Why the Caged Bird Sings, 1969"}, {"text": "…I refuse to be reduced by it.", "source": "Letter to My Daughter, 2008"}, {"text": "Try to be a rainbow in someone’s cloud.", "source": "Letter to My Daughter, 2008"}, {"text": "A friend may be waiting behind a stranger’s face.", "source": "Letter to My Daughter, 2008"}]},
 {slug:"pankhurst",name:"Emmeline Pankhurst",years:"1858–1928",country:"Engeland",color:"#7A2E8E",kind:"historisch",
  tagline:"Deeds, not words. Kiesrecht moest je afdwingen.",themes:["kiesrecht", "actie", "moed"],
  bio:"Richtte in 1903 de WSPU op, de suffragettes. Na jaren vergeefs vragen koos ze voor actie en ging vaak de gevangenis in. Vrouwen kregen in 1918 en 1928 in Engeland stemrecht.",quotes:[{"text": "Deeds, not words.", "source": "Motto van de WSPU"}, {"text": "I look upon myself as a prisoner of war.", "source": "Rede in de rechtbank, 1908"}, {"text": "…in our efforts to become law-makers.", "source": "Toespraak, ‘We are here, not because we are law-breakers’"}]},
 {slug:"butler",name:"Octavia E. Butler",years:"1947–2006",country:"Verenigde Staten",color:"#2A7F8C",kind:"historisch",
  tagline:"Sciencefiction over macht, verandering en samen overleven.",themes:["verandering", "toekomst", "gemeenschap"],
  bio:"Zwarte sciencefictionschrijver, de eerste in het genre met een MacArthur-beurs. Schreef over macht, ras, gender en hoe mensen samen een toekomst bouwen.",quotes:[{"text": "The only lasting truth is Change.", "source": "Parable of the Sower, 1993"}, {"text": "There is no end to what a living world will demand of you.", "source": "Parable of the Sower, 1993"}]},
 {slug:"varda",name:"Agnès Varda",years:"1928–2019",country:"België / Frankrijk",color:"#E7B21E",kind:"historisch",
  tagline:"Regisseur met nieuwsgierigheid, humor en aandacht voor gewone mensen.",themes:["creativiteit", "nieuwsgierigheid", "kijken"],
  bio:"Pionier van de Franse Nouvelle Vague. Maakte films, foto’s en kunst, vaak over vrouwen en gewone mensen. Kreeg in 2017 een Oscar voor haar levenswerk.",quotes:[{"text": "Three words are important to me: inspiration, creation, sharing.", "source": "Varda par Agnès, 2019"}, {"text": "Nothing is banal if you film people with empathy and love.", "source": "Varda par Agnès, 2019"}]},
 {slug:"ginsburg",name:"Ruth Bader Ginsburg",years:"1933–2020",country:"Verenigde Staten",color:"#3C4DA8",kind:"historisch",
  tagline:"Jurist die wetten veranderde, één stap tegelijk.",themes:["recht", "volhouden", "gelijkheid"],
  bio:"Advocaat en later rechter bij het Amerikaanse Hooggerechtshof (1993–2020). Won zaken die de wet voor mannen en vrouwen gelijker maakten, stap voor stap.",quotes:[{"text": "Women belong in all places where decisions are being made.", "source": "Interview, 2009"}, {"text": "You can disagree without being disagreeable.", "source": "Toespraak Cornell University, 2016"}]},
 {slug:"greer",name:"Germaine Greer",years:"geboren 1939",country:"Australië",color:"#C8553D",kind:"nu",
  tagline:"Scherp, provocerend en omstreden. Vrouwen moeten bevrijd worden, niet gelijk gemaakt.",themes:["lichaam", "bevrijding", "kritiek"],
  bio:"Schreef in 1970 The Female Eunuch, een boegbeeld van het feminisme van de tweede golf. Wil bevrijding van vrouwen, meer dan gelijkheid met mannen. Omstreden om haar uitspraken over transvrouwen.",quotes:[{"text": "Whenever we treat women’s bodies as aesthetic objects without function we deform them.", "source": "The Female Eunuch, 1970"}, {"text": "Abandonment of slavery is also the banishment of the chimera of security.", "source": "The Female Eunuch, 1970"}]}
];

function toast(t){
  var d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.appendChild(d);
  setTimeout(function(){ d.remove(); }, 3600);
}
function friendlyAuthError(e){
  var m = String((e && e.message) || '').toLowerCase();
  if (m.indexOf('invalid login') > -1) return 'E-mailadres of wachtwoord klopt niet.';
  if (m.indexOf('already registered') > -1 || m.indexOf('already been registered') > -1) return 'Dit e-mailadres heeft al een account. Log in.';
  if (m.indexOf('password') > -1 && (m.indexOf('least') > -1 || m.indexOf('weak') > -1 || m.indexOf('short') > -1)) return 'Kies een wachtwoord van minimaal 6 tekens.';
  if (m.indexOf('valid email') > -1 || m.indexOf('invalid email') > -1 || m.indexOf('email address') > -1 && m.indexOf('invalid') > -1) return 'Dit e-mailadres lijkt niet te kloppen.';
  if (m.indexOf('rate limit') > -1 || m.indexOf('too many') > -1) return 'Even rustig aan. Probeer het over een paar minuten nog eens.';
  if (m.indexOf('confirm') > -1) return 'Je e-mailadres is nog niet bevestigd. Kijk in je mail.';
  return 'Er ging iets mis. Probeer het zo nog eens.';
}
function dayIndex(){ var d = new Date(); return Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 86400000); }
function quoteOfDay(){
  var all = [];
  S.figures.forEach(function(f){ (f.quotes || []).forEach(function(q){ all.push({q:q, f:f}); }); });
  if (!all.length) return null;
  return all[dayIndex() % all.length];
}
function roomTitle(r){
  if (r.title) return r.title;
  var n = (r.figs || []).map(function(s){ var f = figBySlug(s); return f ? shortName(f) : ''; }).filter(Boolean);
  return n.length ? 'Chat met ' + n.join(', ') : 'Chat';
}

/* ---------- dagelijkse quiz ---------- */
function today(){ var d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function rng(seed){ var a = seed>>>0; return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a>>>15, 1 | a); t = t + Math.imul(t ^ t>>>7, 61 | t) ^ t; return ((t ^ t>>>14)>>>0) / 4294967296; }; }
function seedOf(s){ var n = 2166136261; for (var i=0;i<s.length;i++){ n ^= s.charCodeAt(i); n = Math.imul(n, 16777619); } return n>>>0; }
function pick(arr, r, n){
  var a = arr.slice();
  for (var i=a.length-1;i>0;i--){ var j = Math.floor(r()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
  return a.slice(0, n);
}
function quizQuestions(day){
  var figs = S.figures.filter(function(f){ return f.name && f.years; });
  if (figs.length < 4) return [];
  var r = rng(seedOf(day)), out = [], used = {};
  var kinds = ['quote','land','tijd'];
  for (var k = 0; k < 3; k++){
    var kind = kinds[k], tries = 0, q = null;
    while (!q && tries++ < 40){
      var f = figs[Math.floor(r()*figs.length)];
      if (used[f.slug + kind]) continue;
      if (kind === 'quote'){
        var qs = (f.quotes||[]); if (!qs.length) continue;
        var qt = qs[Math.floor(r()*qs.length)];
        var others = pick(figs.filter(function(x){ return x.slug !== f.slug; }), r, 3).map(function(x){ return x.name; });
        q = {vraag:'Wie zei dit?', extra:'“'+qt.text+'”', opties: pick(others.concat([f.name]), r, 4), goed: f.name};
      } else if (kind === 'land'){
        var landen = {}; figs.forEach(function(x){ landen[x.country] = 1; });
        var andere = pick(Object.keys(landen).filter(function(c){ return c !== f.country; }), r, 3);
        if (andere.length < 3) continue;
        q = {vraag:'Waar komt '+f.name+' vandaan?', extra:'', opties: pick(andere.concat([f.country]), r, 4), goed: f.country};
      } else {
        var jaren = pick(figs.filter(function(x){ return x.years !== f.years; }), r, 3).map(function(x){ return x.years; });
        if (jaren.length < 3) continue;
        q = {vraag:'Wanneer leefde '+f.name+'?', extra:'', opties: pick(jaren.concat([f.years]), r, 4), goed: f.years};
      }
      used[f.slug + kind] = 1;
    }
    if (q) out.push(q);
  }
  return out;
}
async function loadQuiz(){
  if (!sb || !S.user) return;
  var day = today();
  S.quiz = {day: day, vragen: quizQuestions(day), given: [], points: 0, reveal: null};
  try{
    var r = await sb.from('quiz_days').select('*').eq('user_id', S.user.id).eq('day', day).maybeSingle();
    if (r.data){ S.quiz.given = r.data.given || []; S.quiz.points = r.data.points || 0; }
  }catch(e){}
  try{
    var b = await sb.rpc('quiz_board'); if (!b.error) S.board = b.data || [];
    var w = await sb.rpc('quiz_winner'); if (!w.error) S.winner = (w.data && w.data[0]) || null;
  }catch(e){}
  if (S.tab === 'quiz') render();
}
async function answer(i, keuze){
  var q = S.quiz; if (!q || S.quizBusy || q.given.length !== i) return;
  S.quizBusy = true;
  q.given.push(keuze);
  if (keuze === q.vragen[i].goed) q.points += 3;
  q.reveal = i;
  render();
  try{
    await sb.from('quiz_days').upsert({user_id:S.user.id, day:q.day, points:q.points, given:q.given}, {onConflict:'user_id,day'});
  }catch(e){ toast('Je antwoord opslaan lukte niet.'); }
  S.quizBusy = false;
  if (q.given.length === q.vragen.length){
    try{ var b = await sb.rpc('quiz_board'); if (!b.error){ S.board = b.data || []; render(); } }catch(e){}
  }
}

      sb.from('room_figures').select('figure_slug').eq('room_id',id)
    ]);
    if (r[0].data){ S.room.title = r[0].data.title; S.room.code = r[0].data.invite_code; }
    (r[1].data||[]).forEach(function(m){ S.members[m.user_id] = (m.profiles && m.profiles.name) || 'Iemand'; });
    S.roomFigs = (r[2].data||[]).map(function(x){return x.figure_slug;});
  }catch(e){}
  headInfo();
  await fetchMessages();
  subscribe();
}
function headInfo(){
  var t = $('#ctitle'); if (!t) return;
  t.textContent = roomTitle({title:S.room.title, figs:S.roomFigs});
  var people = Object.keys(S.members).map(function(k){ return k===S.user.id ? 'Jij' : S.members[k]; });
  var names = S.roomFigs.map(function(s){ var f=figBySlug(s); return f?shortName(f):''; }).filter(Boolean);
  $('#cmeta').textContent = [people.join(', '), names.join(', ')].filter(Boolean).join(' · ');
}
function drawChatShell(){
  root.innerHTML =
   '<div class="chat"><header class="chat-top"><button class="ib" data-act="back" aria-label="Terug">←</button>'
  +'<div class="ct"><b id="ctitle"></b><small id="cmeta"></small></div><button class="ib" data-act="info">Info</button></header>'
  +'<div id="list" class="list"><div class="note">Dit zijn AI-interpretaties, niet de echte vrouwen. Een citaat met bron is echt, de rest is een interpretatie van hun ideeën.</div></div>'
  +'<div id="typing" class="typing" hidden></div>'
  +'<form id="composer" class="composer"><button type="button" class="sw" id="sw" data-act="toggleask" aria-pressed="true"><i></i><span id="swt">Vrouwen reageren</span></button>'
  +'<div class="inp"><textarea id="msg" rows="1" placeholder="Vertel waar je mee zit…"></textarea><button class="send" aria-label="Verstuur">↑</button></div></form></div>';
  headInfo();
}
async function fetchMessages(){
  try{
    var r = await sb.from('messages').select('*').eq('room_id',S.room.id).order('created_at').limit(400);
    if (r.error) throw r.error;
    (r.data||[]).forEach(function(m){ addMsg(m, true); });
    await fetchLikes();
    scrollEnd(true);
    maybeNudge();
  }catch(e){ toast('Berichten laden lukt niet. Probeer het zo nog eens.'); }
}
async function fetchLikes(){
  try{
    var ids = S.msgs.map(function(m){ return m.id; });
    if (!ids.length) return;
    var r = await sb.from('message_likes').select('message_id,user_id').in('message_id', ids);
    if (r.error) return;
    S.likes = {};
    (r.data||[]).forEach(function(x){ (S.likes[x.message_id] = S.likes[x.message_id] || []).push(x.user_id); });
    S.msgs.forEach(function(m){ paintLike(m.id); });
  }catch(e){}
}
function likeHTML(id){
  var who = S.likes[id] || [], mine = who.indexOf(S.user.id) > -1;
  return '<button class="lb'+(mine?' on':'')+'" data-act="like" data-id="'+esc(id)+'" aria-pressed="'+(mine?'true':'false')+'">'
    + HRT + (who.length ? '<span>'+who.length+'</span>' : '') + '</button>';
}
function paintLike(id){
  var el = document.querySelector('.lw[data-id="'+id+'"]');
  if (el) el.innerHTML = likeHTML(id);
}
async function toggleLike(id){
  var who = S.likes[id] = S.likes[id] || [], i = who.indexOf(S.user.id);
  if (i > -1){ who.splice(i,1); paintLike(id); try{ await sb.from('message_likes').delete().eq('message_id',id).eq('user_id',S.user.id); }catch(e){} }
  else { who.push(S.user.id); paintLike(id); try{ await sb.from('message_likes').insert({message_id:id, user_id:S.user.id}); }catch(e){} }
}
function nameOf(uid){ return S.members[uid] || 'Iemand'; }
var HRT = '<svg width="15" height="15" viewBox="0 0 24 24" fill="#E8409A" stroke="#141414" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-8-5-8-11a4.5 4.5 0 0 1 8-2.5A4.5 4.5 0 0 1 20 9c0 6-8 11-8 11z"/></svg>';
function msgHTML(m){
  if (m.figure_slug){
    var f = figBySlug(m.figure_slug) || {name:m.figure_slug,color:'#999'};
    if (m.react === 'like' && !(m.content||'').trim()){
      return '<div class="m fig lkm">'+sm(f)+'<span>'+esc(f.name)+' vindt dit goed '+HRT+'</span></div>';
    }
    if (m.react === 'kort'){
      return '<div class="m fig">'+sm(f)+'<div class="bub kort"><span class="who">'+esc(f.name)+'</span>'+br(m.content)+'<span class="lw" data-id="'+esc(m.id)+'">'+likeHTML(m.id)+'</span></div></div>';
    }
    return '<div class="m fig">'+sm(f)+'<div class="bub"><span class="who">'+esc(f.name)+'<i>AI-interpretatie</i></span>'+br(m.content)
      +(m.quote?'<div class="q">“'+esc(m.quote)+'”<cite>'+esc(m.quote_source||'')+'</cite></div>':'')
      +(m.takeaway?'<div class="tk">'+ROCKET+'<span>'+esc(m.takeaway)+'</span></div>':'')
      +(m.suggest_slug && S.roomFigs.indexOf(m.suggest_slug) < 0 && figBySlug(m.suggest_slug)
         ? '<button class="btn sug" data-act="addsug" data-s="'+esc(m.suggest_slug)+'">'+esc(figBySlug(m.suggest_slug).name)+' uitnodigen</button>' : '')
      +'<span class="lw" data-id="'+esc(m.id)+'">'+likeHTML(m.id)+'</span></div></div>';
  }
  var me = m.user_id === S.user.id;
  return '<div class="m '+(me?'me':'')+'"><div class="bub">'+(me?'':'<span class="who">'+esc(nameOf(m.user_id))+'</span>')+br(m.content)
    +'<span class="lw" data-id="'+esc(m.id)+'">'+likeHTML(m.id)+'</span></div></div>';
}
function addMsg(m, quiet){
  if (!m || S.ids[m.id]) return;
  S.ids[m.id] = 1; S.msgs.push(m);
  var l = $('#list'); if (!l) return;
  var near = l.scrollHeight - l.scrollTop - l.clientHeight < 160;
  l.insertAdjacentHTML('beforeend', msgHTML(m));
  if (m.figure_slug) showTyping(false);
  if (!quiet && (near || m.user_id === S.user.id)) scrollEnd();
}
function scrollEnd(){ var l = $('#list'); if (l) l.scrollTop = l.scrollHeight; }
function showTyping(on, who){
  var t = $('#typing'); if (!t) return;
  clearTimeout(S.typingTimer);
  if (!on){ t.hidden = true; return; }
  var names = S.roomFigs.map(function(s){ var f=figBySlug(s); return f?shortName(f):''; }).filter(Boolean);
  t.textContent = (names.length === 1 ? names[0] + ' denkt na…' : 'De vrouwen denken na…');
  t.hidden = false; scrollEnd();
  S.typingTimer = setTimeout(function(){ t.hidden = true; }, 40000);
}
function subscribe(){
  unsubscribe();
  var rid = S.room.id;
  S.channel = sb.channel('room-'+rid).on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:'room_id=eq.'+rid}, async function(p){
    var m = p.new; if (!m || S.ids[m.id]) return;
    if (m.user_id && !S.members[m.user_id]){
      try{ var r = await sb.from('profiles').select('name').eq('id',m.user_id).maybeSingle(); S.members[m.user_id] = (r.data&&r.data.name)||'Iemand'; headInfo(); }catch(e){}
    }
    addMsg(m);
    if (m.user_id && m.user_id !== S.user.id && m.asked_ai) showTyping(true);
  }).on('postgres_changes',{event:'*',schema:'public',table:'message_likes'}, function(p){
    var row = p.new && p.new.message_id ? p.new : p.old;
    if (!row || !S.ids[row.message_id]) return;
    var who = S.likes[row.message_id] = S.likes[row.message_id] || [], i = who.indexOf(row.user_id);
    if (p.eventType === 'DELETE'){ if (i > -1) who.splice(i,1); }
    else if (i < 0) who.push(row.user_id);
    paintLike(row.message_id);
  }).subscribe();
}
function unsubscribe(){ if (S.channel){ try{ sb.removeChannel(S.channel); }catch(e){} S.channel = null; } }
function leaveView(){
  unsubscribe(); showTyping(false); S.room = null; closeSheet();
  loadRooms().then(function(){ if (!S.room) render(); });
  render();
}

function errText(code){
  if (code === 'limit') return 'Je hebt vandaag veel gevraagd. Morgen is er weer ruimte.';
  if (code === 'no_key') return 'De vrouwen zijn nog niet aangesloten. Check het stappenplan (de sleutel ontbreekt).';
  if (code === 'empty') return 'Er kwam geen tekst binnen. Typ je bericht opnieuw.';
  return 'De vrouwen zijn even stil. Probeer het zo nog eens.';
}
async function askAI(){
  showTyping(true);
  var code = '';
  try{
    var r = await sb.functions.invoke('chat', {body:{room_id:S.room.id}});
    if (r.error){
      try{ var j = await r.error.context.json(); code = j.error; }catch(e){ code = 'x'; }
      showTyping(false); toast(errText(code));
    }
  }catch(e){ showTyping(false); toast(errText('x')); }
  await fetchMessagesMerge();
}
async function fetchMessagesMerge(){
  if (!S.room) return;
  try{
    var r = await sb.from('messages').select('*').eq('room_id',S.room.id).order('created_at').limit(400);
    (r.data||[]).forEach(function(m){ if (!S.ids[m.id]) addMsg(m); });
  }catch(e){}
}
async function send(){
  var ta = $('#msg'); if (!ta || S.sending) return;
  var text = ta.value.trim(); if (!text) return;
  S.sending = true; ta.value = ''; ta.style.height = 'auto';
  var ask = S.ask;
  var r = await sb.from('messages').insert({room_id:S.room.id,user_id:S.user.id,content:text,asked_ai:ask}).select('*').single();
  if (r.error || !r.data){ toast('Versturen lukt niet. Probeer het nog eens.'); ta.value = text; S.sending = false; return; }
  addMsg(r.data);
  if (ask) await askAI();
  S.sending = false;
}

function infoSheet(){
  var link = location.origin + location.pathname + '?code=' + S.room.code;
  var people = Object.keys(S.members).map(function(k){ return esc(k===S.user.id ? 'Jij' : S.members[k]); }).join(', ');
  var h = '<button class="x" data-act="close">Sluiten</button><h3>Vrienden uitnodigen</h3>'
   +'<div class="code">'+esc(S.room.code)+'</div>'
   +'<p class="hint" style="text-align:center">Je vriend(in) maakt een account en kiest “Doe mee met code”. Of stuur de link.</p>'
   +'<div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center"><button class="btn main" data-act="share">Deel uitnodiging</button><button class="btn" data-act="copy">Kopieer link</button></div>'
   +'<p><b class="cap" style="font-size:12px">Wie zitten erin</b><br>'+people+'</p>'
   +'<div><b class="cap" style="font-size:12px">De vrouwen</b><div class="chips" style="margin-top:8px">'
   + S.figures.map(function(f){ var inn = S.roomFigs.indexOf(f.slug)>-1; return inn
       ? '<span class="chip pick on">'+esc(f.name)+'<button class="rm" data-act="rmfig" data-s="'+esc(f.slug)+'" title="Uit de chat halen" aria-label="'+esc(f.name)+' uit de chat halen">×</button></span>'
       : '<button class="chip pick" data-act="addfig" data-s="'+esc(f.slug)+'">'+esc(f.name)+(inn?'':' +')+'</button>'; }).join('')
   +'</div></div>'
   +'<div><button class="link" data-act="leave">Chat verlaten</button></div>';
  sheet(h);
  S._link = link;
}

/* ---------- Acties ---------- */
async function doJoin(code, silent){
  code = String(code||'').trim();
  if (!code){ return; }
  var r = await sb.rpc('join_room', {p_code: code});
  if (r.error){
    var e = $('#jerr');
    var msg = String(r.error.message||'').indexOf('onbekend') > -1 ? 'Deze code kennen we niet. Check of je hem goed hebt overgetypt.' : 'Meedoen lukt niet. Probeer het zo nog eens.';
    if (e){ e.textContent = msg; e.hidden = false; } else toast(msg);
    if (silent) render();
    return;
  }
  closeSheet(); await loadRooms(); await openRoom(r.data);
}

function shrink(file, max){
  return new Promise(function(res, rej){
    var im = new Image(), u = URL.createObjectURL(file);
    im.onload = function(){
      var k = Math.min(1, max/Math.max(im.width, im.height)), c = document.createElement('canvas');
      c.width = Math.round(im.width*k); c.height = Math.round(im.height*k);
      c.getContext('2d').drawImage(im,0,0,c.width,c.height); URL.revokeObjectURL(u);
      c.toBlob(function(b){ b ? res(b) : rej(new Error('geen plaatje')); }, 'image/jpeg', 0.85);
    };
    im.onerror = function(){ rej(new Error('geen plaatje')); }; im.src = u;
  });
}
async function setPhoto(slug, file){
  try{
    var blob = await shrink(file, 640), path = slug+'.jpg';
    var up = await sb.storage.from('figure-photos').upload(path, blob, {upsert:true, contentType:'image/jpeg'});
    if (up.error) throw up.error;
    var url = sb.storage.from('figure-photos').getPublicUrl(path).data.publicUrl + '?v=' + Date.now();
    var r = await sb.rpc('set_figure_photo', {fslug:slug, url:url}); if (r.error) throw r.error;
    var f = figBySlug(slug); if (f) f.photo_url = url;
    closeSheet(); render(); toast('Foto staat erin.');
  }catch(e){ toast('Foto opslaan lukte niet. Controleer of je beheerder bent en supabase.sql is gedraaid.'); }
}
document.addEventListener('visibilitychange', function(){
  if (document.visibilityState !== 'visible' || !sb || !S.user) return;
  if (S.room){ markSeen(S.room.id); return; }
  loadRooms().then(function(){ if (!S.room && S.tab === 'chats') render(); });
});
document.addEventListener('change', function(e){
  var t = e.target; if (t && t.id === 'phfile' && t.files && t.files[0]) setPhoto(t.dataset.s, t.files[0]);
});
document.addEventListener('click', async function(e){
  var a = e.target.closest('[data-act]'); if (!a) return;
  var act = a.dataset.act;
  try{
  if (act === 'tab'){ S.tab = a.dataset.t; if (S.tab === 'quiz') loadQuiz(); render(); window.scrollTo(0,0); }
  else if (act === 'qa'){ await answer(Number(a.dataset.i), a.dataset.o); }
  else if (act === 'qnext'){ if (S.quiz){ S.quiz.reveal = null; render(); } }
  else if (act === 'close'){ closeSheet(); }
  else if (act === 'mode'){ S.authMode = a.dataset.m; render(); }
  else if (act === 'like'){ await toggleLike(a.dataset.id); }
  else if (act === 'fig'){ figSheet(a.dataset.s); }
  else if (act === 'casave'){
    var adv = {rocket: ($('#ca-r')||{}).value || '', eye: ($('#ca-e')||{}).value || '', heart: ($('#ca-h')||{}).value || ''};
    var rc = await sb.rpc('set_card_advice', {fslug: a.dataset.s, rocket: adv.rocket, eye: adv.eye, heart: adv.heart});
    if (rc.error){ toast('Opslaan lukt niet. Draai eerst de nieuwe SQL.'); return; }
    var fa = figBySlug(a.dataset.s);
    if (fa) fa.card_advice = {rocket: adv.rocket.trim()||undefined, eye: adv.eye.trim()||undefined, heart: adv.heart.trim()||undefined};
    closeSheet(); render(); toast('Opgeslagen.');
  }
  else if (act === 'phdel'){
    var r2 = await sb.rpc('set_figure_photo', {fslug:a.dataset.s, url:null});
    if (r2.error) toast('Weghalen lukte niet.'); else { var ff = figBySlug(a.dataset.s); if (ff) ff.photo_url = null; closeSheet(); render(); }
  }
  else if (act === 'new'){ newSheet(); }
  else if (act === 'newwith'){ newSheet(a.dataset.s); }
  else if (act === 'joinform'){ joinSheet(); }
  else if (act === 'pick'){ var s = a.dataset.s; picked[s] = !picked[s]; a.classList.toggle('on', !!picked[s]); }
  else if (act === 'create'){
    var sel = Object.keys(picked).filter(function(k){return picked[k];});
    var er = $('#nerr');
    if (!sel.length){ er.textContent = 'Kies minstens één vrouw.'; er.hidden = false; return; }
    a.disabled = true;
    var r = await sb.rpc('create_room', {p_title: ($('#ntitle').value||''), p_figures: sel});
    if (r.error){
      er.innerHTML = 'Chat starten lukt niet. Probeer het zo nog eens.<span class="hint" style="display:block;margin-top:6px">Melding: '+esc(r.error.message||r.error.code||'onbekend')+'</span>';
      er.hidden = false; a.disabled = false; return;
    }
    closeSheet(); await loadRooms(); await openRoom(r.data);
  }
  else if (act === 'join'){ await doJoin($('#jcode').value); }
  else if (act === 'open'){ await openRoom(a.dataset.id); }
  else if (act === 'back'){ leaveView(); }
  else if (act === 'info'){ infoSheet(); }
  else if (act === 'toggleask'){
    S.ask = !S.ask; a.setAttribute('aria-pressed', S.ask ? 'true' : 'false');
    $('#swt').textContent = S.ask ? 'Vrouwen reageren' : 'Alleen vrienden';
  }
  else if (act === 'share'){
    var text = 'Doe mee met mijn chat in "Shoulders". Maak een account en kies "Doe mee met code": ' + S.room.code;
    if (navigator.share){ try{ await navigator.share({title:'Shoulders', text:text, url:S._link}); }catch(x){} }
    else { try{ await navigator.clipboard.writeText(text + '\n' + S._link); toast('Uitnodiging gekopieerd.'); }catch(x){ toast('Kopiëren lukt niet. Geef de code door: '+S.room.code); } }
  }
  else if (act === 'copy'){ try{ await navigator.clipboard.writeText(S._link); toast('Link gekopieerd.'); }catch(x){ toast('Kopiëren lukt niet. Geef de code door: '+S.room.code); } }
  else if (act === 'addsug'){
    var rs = await sb.rpc('add_figures', {rid: S.room.id, p_figures:[a.dataset.s]});
    if (rs.error){ toast('Uitnodigen lukt niet. Probeer het zo nog eens.'); return; }
    S.roomFigs.push(a.dataset.s);
    var fz = figBySlug(a.dataset.s);
    toast((fz ? fz.name : 'Ze') + ' doet nu mee.');
    headInfo();
    var li = $('#list');
    if (li){ li.innerHTML = S.msgs.map(msgHTML).join(''); scrollEnd(); }
  }
  else if (act === 'rmfig'){
    var fg = figBySlug(a.dataset.s), nm = fg ? fg.name : 'Deze vrouw';
    if (!confirm(nm + ' uit deze chat halen? Haar eerdere berichten blijven staan.')) return;
    var rr2 = await sb.rpc('remove_figures', {rid: S.room.id, p_figures:[a.dataset.s]});
    if (rr2.error){ toast('Weghalen lukt niet. Probeer het zo nog eens.'); return; }
    S.roomFigs = S.roomFigs.filter(function(x){ return x !== a.dataset.s; });
    headInfo(); infoSheet(); toast(nm + ' doet niet meer mee.');
  }
  else if (act === 'addfig'){
    var rr = await sb.rpc('add_figures', {rid: S.room.id, p_figures:[a.dataset.s]});
    if (rr.error){ toast('Toevoegen lukt niet. Probeer het zo nog eens.'); return; }
    S.roomFigs.push(a.dataset.s); headInfo(); infoSheet();
  }
  else if (act === 'leave'){
    if (!confirm('Weet je zeker dat je deze chat wilt verlaten?')) return;
    await sb.rpc('leave_room', {rid: S.room.id}); closeSheet(); leaveView();
  }
  else if (act === 'logout'){ await sb.auth.signOut(); }
  }catch(err){ console.error(err); toast('Er ging iets mis. Probeer het zo nog eens.'); }
});

document.addEventListener('submit', async function(e){
  e.preventDefault();
  if (e.target.id === 'composer'){ send(); return; }
  if (e.target.id === 'authform'){
    var signup = S.authMode === 'signup';
    var btn = $('#abtn'), er = $('#autherr');
    er.hidden = true; btn.disabled = true;
    var email = $('#amail').value.trim(), pass = $('#apass').value;
    try{
      var r;
      if (signup){
        var name = $('#aname').value.trim();
        r = await sb.auth.signUp({email:email, password:pass, options:{data:{name:name}}});
        if (!r.error && !r.data.session){ er.className = 'ok'; er.textContent = 'Bijna klaar. Kijk in je mail om je account te bevestigen.'; er.hidden = false; btn.disabled = false; return; }
      } else {
        r = await sb.auth.signInWithPassword({email:email, password:pass});
      }
      if (r.error){ er.className = 'err'; er.textContent = friendlyAuthError(r.error); er.hidden = false; btn.disabled = false; }
    }catch(x){ er.className = 'err'; er.textContent = friendlyAuthError(x); er.hidden = false; btn.disabled = false; }
  }
});
document.addEventListener('keydown', function(e){
  if (e.target && e.target.id === 'msg' && e.key === 'Enter' && (e.metaKey || e.ctrlKey)){ e.preventDefault(); send(); }
});
document.addEventListener('input', function(e){
  if (e.target && e.target.id === 'msg'){ e.target.style.height = 'auto'; e.target.style.height = Math.min(e.target.scrollHeight, 140) + 'px'; }
});

/* ---------- Start ---------- */
(function init(){
  try{
    var p = new URLSearchParams(location.search).get('code');
    if (p){ sessionStorage.setItem('joincode', p); history.replaceState(null,'',location.pathname); }
  }catch(e){}
  if (!sb){ render(); return; }
  var started = false;
  sb.auth.onAuthStateChange(function(ev, session){
    if (session && session.user){
      if (S.user && S.user.id === session.user.id && started) return;
      S.user = session.user; started = true;
      setTimeout(afterLogin, 0);
    } else {
      S.user = null; S.profile = null; S.rooms = []; S.ready = false; S.room = null; started = false; unsubscribe(); render();
    }
  });
  sb.auth.getSession().then(function(r){ if (!r.data.session) render(); });
})();
})();
</script>
</body>
</html>
